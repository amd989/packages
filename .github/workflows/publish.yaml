name: publish

# Central publisher for packages.alejandro.md.
#
# Project repositories do not write to R2. They build their own artifacts,
# attach them to their own GitHub Release, then fire a repository_dispatch
# here. This job is the only holder of the R2 credentials and the only writer
# of the reprepro database, which is why it is serialized by a concurrency
# group rather than run per project.
#
# Channels: deb (reprepro), rpm (createrepo_c), FreeBSD pkg, OpenWrt ipk
# and apk. Which of them a project publishes is declared in projects/*.json.

on:
  repository_dispatch:
    types: [publish]

  workflow_dispatch:
    inputs:
      repo:
        description: "Project to publish, e.g. mariner3d/mariner. Blank publishes every registered project."
        required: false
      tag:
        description: "Release tag. Blank uses that project's latest release."
        required: false
      rebuild:
        description: "Discard reprepro state and rebuild the repository from scratch"
        type: boolean
        default: false

  schedule:
    # Weekly reconciliation: re-derives the index from every project's latest
    # release, so a dispatch that was dropped or failed self-heals.
    - cron: "0 4 * * 0"

concurrency:
  group: publish
  cancel-in-progress: false

env:
  R2_PUBLIC_BUCKET: packages
  R2_STATE_BUCKET: packages-state
  PUBLIC_BASE_URL: https://packages.alejandro.md
  EXPECTED_FPR: 7802971A833983DD60CD4C1F68A66E3B0EA6F825

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # No config file: the remote is defined entirely by the variables
      # below. Naming it /dev/null also stops rclone warning about its
      # absence, which otherwise lands in every error message.
      RCLONE_CONFIG: /dev/null
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      # R2 rejects object ACLs outright, and the API token is scoped to these
      # two buckets, so the bucket-existence probe has to be skipped.
      RCLONE_CONFIG_R2_ACL: private
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Verify required secrets are present
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          missing=0
          for name in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY GPG_PRIVATE_KEY; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then
              echo "::error::$name is not set"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Install tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            reprepro rclone jq createrepo-c rpm binutils gzip

      - name: Check R2 access
        run: |
          set -euo pipefail

          # A denied read here used to surface much later as a bland
          # "no existing rpm packages", so the credentials are proven once,
          # before anything is built or signed.
          # Both buckets are reported before giving up, so one look at the
          # log is enough to tell a missing bucket from a token that only
          # covers one of them.
          denied=0
          for bucket in "$R2_PUBLIC_BUCKET" "$R2_STATE_BUCKET"; do
            if rclone lsjson "r2:$bucket" --max-depth 1 >/dev/null 2>r2.err; then
              echo "read ok: $bucket"
              continue
            fi
            reason=$(grep -m1 -E 'ERROR|Denied|NoSuch|Forbidden|Failed' r2.err || grep -m1 . r2.err || echo 'unknown error')
            echo "::error::Cannot list the R2 bucket '$bucket': $reason"
            denied=$((denied + 1))
          done

          if [ "$denied" -gt 0 ]; then
            echo "AccessDenied means the key authenticated and is simply not"
            echo "allowed on that bucket. A wrong account id or secret gives"
            echo "InvalidAccessKeyId or SignatureDoesNotMatch instead, so the"
            echo "credentials themselves are fine and the problem is one of:"
            echo "  - the bucket does not exist under exactly that name"
            echo "  - the R2 API token is scoped to other buckets"
            echo "  - the token was made under My Profile rather than R2, which"
            echo "    does not produce an S3 key pair at all"
            echo "The token needs Object Read and Write on both buckets. One"
            echo "scoped to individual objects or to a prefix cannot list, and"
            echo "this publisher lists in order to reconcile what is published."
            exit 1
          fi

          echo probe > r2-probe.txt
          if ! rclone copyto r2-probe.txt "r2:${R2_PUBLIC_BUCKET}/.r2-write-probe" 2>r2.err; then
            reason=$(grep -m1 -E 'ERROR|Denied|NoSuch|Forbidden|Failed' r2.err || grep -m1 . r2.err || echo 'unknown error')
            echo "::error::Cannot write to the R2 bucket '${R2_PUBLIC_BUCKET}': $reason"
            exit 1
          fi
          rclone deletefile "r2:${R2_PUBLIC_BUCKET}/.r2-write-probe" || true
          rm -f r2-probe.txt r2.err
          echo "write ok: ${R2_PUBLIC_BUCKET}"

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import

          FPR=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
          if [ -z "$FPR" ]; then
            echo "::error::GPG import produced no usable secret key."
            exit 1
          fi
          if [ "$FPR" != "$EXPECTED_FPR" ]; then
            echo "::error::Imported key $FPR does not match the published repository key $EXPECTED_FPR. Refusing to re-sign with a different key."
            exit 1
          fi

          echo "GPG_KEY_ID=$FPR" >> "$GITHUB_ENV"
          gpg --armor --export "$FPR" > gpg.key

          # rpm signs through gpg but drives it itself, so it needs to know
          # which key to use. Only the key name is set here: %__gpg_sign_cmd
          # is deliberately not overridden, because its correct form differs
          # between rpm versions. rpm 4.19 moved signing to a shell, which
          # makes the argv[0] duplication that older examples carry
          # ("%{__gpg} gpg --batch ...") turn the second word into a
          # filename, and gpg then rejects every following flag. The
          # distribution's own macro is correct for its own rpm.
          cat > "$HOME/.rpmmacros" <<EOF
          %_signature gpg
          %_gpg_name $FPR
          EOF

      - name: Resolve what to publish
        id: targets
        env:
          EVENT_NAME: ${{ github.event_name }}
          PAYLOAD_REPO: ${{ github.event.client_payload.repo }}
          PAYLOAD_TAG: ${{ github.event.client_payload.tag }}
          INPUT_REPO: ${{ inputs.repo }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          REQ_REPO=""
          REQ_TAG=""

          case "$EVENT_NAME" in
            repository_dispatch)
              REQ_REPO="$PAYLOAD_REPO"
              REQ_TAG="$PAYLOAD_TAG"
              if [ -z "$REQ_REPO" ]; then
                echo "::error::client_payload.repo is required."
                exit 1
              fi
              ;;
            workflow_dispatch)
              REQ_REPO="$INPUT_REPO"
              REQ_TAG="$INPUT_TAG"
              ;;
          esac

          # A dispatch can only publish for a project registered in projects/.
          # Without this check, anyone able to fire the event could inject
          # packages from a repository of their own.
          if [ -n "$REQ_REPO" ]; then
            if ! jq -e -s --arg r "$REQ_REPO" 'any(.[]; .repo == $r)' projects/*.json >/dev/null; then
              echo "::error::$REQ_REPO is not registered in projects/. Add it there first."
              exit 1
            fi
            jq -c -s --arg r "$REQ_REPO" --arg t "$REQ_TAG" \
              '.[] | select(.repo == $r) | {name, repo, suites, formats, tag: $t}' \
              projects/*.json > targets.jsonl
          else
            jq -c -s '.[] | {name, repo, suites, formats, tag: ""}' \
              projects/*.json > targets.jsonl
          fi

          echo "publishing:"
          cat targets.jsonl

          # Per-format flags, so the FreeBSD VM and the container steps only
          # run when something actually needs them.
          for fmt in deb rpm pkg ipk apk; do
            if jq -e -s --arg f "$fmt" 'any(.[]; .formats | index($f))' targets.jsonl >/dev/null; then
              echo "has_$fmt=true" >> "$GITHUB_OUTPUT"
            else
              echo "has_$fmt=false" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Restore reprepro state
        env:
          REBUILD: ${{ inputs.rebuild }}
        run: |
          set -euo pipefail
          mkdir -p db deb/pool

          if [ "$REBUILD" = "true" ]; then
            echo "rebuild requested: starting from an empty database and pool"
          else
            rclone copy "r2:${R2_STATE_BUCKET}/reprepro-db" ./db --checksum \
              || echo "no prior state found, starting fresh"

            # The pool has to come back as well, not just the database.
            # reprepro writes only the packages included on this run, but it
            # exports indices for everything the database knows about. So
            # publishing one project with an empty local pool makes the
            # closing "rclone sync deb/pool" delete every other project's
            # files while the indices still advertise them, keyring included.
            rclone copy "r2:${R2_PUBLIC_BUCKET}/deb/pool" ./deb/pool --checksum --transfers 8 \
              || echo "no prior pool found, starting fresh"
          fi

          # An empty database next to a published repository means the state
          # read failed, not that this is a first run. Continuing would export
          # indices holding only the projects published on this run and prune
          # the rest, so stop instead of silently shrinking the repository.
          if [ "$REBUILD" != "true" ] && [ -z "$(ls -A db 2>/dev/null)" ] \
             && rclone lsf "r2:${R2_PUBLIC_BUCKET}/deb/dists/" 2>/dev/null | grep -q .; then
            echo "::error::reprepro state is empty but deb/dists already exists in ${R2_PUBLIC_BUCKET}. Refusing to republish, which would drop every other project from the indices. Re-run with rebuild=true if this is intentional."
            exit 1
          fi

          echo "restored database:"
          ls -la db || true
          echo "restored pool: $(find deb/pool -type f -name '*.deb' 2>/dev/null | wc -l) deb(s)"

      - name: Download release artifacts
        run: |
          set -euo pipefail
          mkdir -p incoming

          while read -r target; do
            [ -n "$target" ] || continue
            repo=$(jq -r '.repo' <<<"$target")
            tag=$(jq -r '.tag' <<<"$target")

            if [ -z "$tag" ] || [ "$tag" = "null" ]; then
              tag=$(gh release view -R "$repo" --json tagName -q .tagName)
              echo "$repo: latest release is $tag"
            fi

            slug=$(echo "$repo" | tr '/' '_')
            for fmt in $(jq -r '.formats[]' <<<"$target"); do
              dest="incoming/$slug/$fmt"
              mkdir -p "$dest"
              gh release download "$tag" -R "$repo" -p "*.$fmt" -D "$dest" --clobber \
                || echo "::warning::$repo $tag has no *.$fmt assets"
            done

            # data.pkg and packagesite.pkg are the FreeBSD repo index that the
            # project built for its own channel, not packages. Including them
            # would have pkg try to install the catalogue.
            rm -f "incoming/$slug/pkg/data.pkg" \
                  "incoming/$slug/pkg/packagesite.pkg" \
                  "incoming/$slug/pkg/packagesite.yaml" 2>/dev/null || true

            echo "$repo $tag" >> downloaded.txt
            find "incoming/$slug" -type f -printf '  %p (%s bytes)\n' | sort
          done < targets.jsonl

      - name: Build the bootstrap packages
        run: |
          set -euo pipefail

          # deb side
          KEYRING_VERSION=$(cat keyring/VERSION)
          ./keyring/build.sh "$KEYRING_VERSION" gpg.key staging/bootstrap-deb
          echo "KEYRING_VERSION=$KEYRING_VERSION" >> "$GITHUB_ENV"

          # rpm side: the symmetric package, since a deb cannot manage
          # /etc/yum.repos.d and dnf has no equivalent of a keyring package.
          #
          # Built with el9's own rpmbuild rather than the runner's. The
          # runner carries rpm 6, and a package it builds ends up with its
          # signature only where rpm 6 looks for it, so el9 sees the one
          # package whose entire job is to configure el9 as unsigned. Every
          # project rpm here is el9-built; this matches them.
          mkdir -p staging/bootstrap-rpm rpmbuild/SOURCES rpmbuild/SPECS
          cp gpg.key rpmbuild/SOURCES/RPM-GPG-KEY-alejandro-md
          sed "s|@@BASE_URL@@|${PUBLIC_BASE_URL}|g" rpm/alejandro-md.repo > rpmbuild/SOURCES/alejandro-md.repo
          sed "s|@@BASE_URL@@|${PUBLIC_BASE_URL}|g" rpm/alejandro-md-release.spec > rpmbuild/SPECS/alejandro-md-release.spec

          docker run --rm -v "$PWD:/w" -w /w quay.io/centos/centos:stream9 bash -c '
            set -e
            dnf -q -y install rpm-build
            rpmbuild --define "_topdir /w/rpmbuild" -bb /w/rpmbuild/SPECS/alejandro-md-release.spec
          '
          sudo chown -R "$(id -u):$(id -g)" rpmbuild
          find rpmbuild/RPMS -name '*.rpm' -exec cp {} staging/bootstrap-rpm/ ';'
          ls -la staging/bootstrap-rpm

      - name: Build the deb repository
        if: steps.targets.outputs.has_deb == 'true'
        run: |
          set -euo pipefail
          RP="reprepro -b . --confdir conf --dbdir db --outdir deb"

          while read -r target; do
            [ -n "$target" ] || continue
            repo=$(jq -r '.repo' <<<"$target")
            slug=$(echo "$repo" | tr '/' '_')
            dir="incoming/$slug/deb"
            [ -d "$dir" ] || continue

            # Projects that build per Debian release carry the codename in the
            # Debian revision, e.g. 0.7.6-1+bookworm and 0.7.6-1+trixie. Those
            # belong only in their own suite: dropping both into every suite
            # lets dpkg version ordering decide, and "1+trixie" outranks
            # "1+bookworm", so bookworm would serve a package built against
            # trixie's interpreter. A version with no +codename suffix is
            # release-independent and goes into every suite the project lists.
            all_suites=$(jq -r '.suites[]' <<<"$target")

            for deb in "$dir"/*.deb; do
              [ -e "$deb" ] || continue
              version=$(dpkg-deb -f "$deb" Version)

              # Everything after the last "+", when there is one. Only treated
              # as a codename if it names a suite we serve, so ordinary Debian
              # suffixes like +dfsg, +ds1 or +git20260101 fall through to the
              # release-independent path instead of being misrouted.
              suffix=""
              case "$version" in *+*) suffix="${version##*+}" ;; esac

              targets_for_deb=""
              for suite in $all_suites; do
                # "stable" is the compatibility suite for sources written
                # before the move, and conf/distributions describes it as
                # carrying the same packages as bookworm, so it tracks the
                # bookworm build rather than expecting a +stable one.
                case "$suite" in
                  stable) want="bookworm" ;;
                  *)      want="$suite" ;;
                esac
                if [ -n "$suffix" ] && [ "$suffix" = "$want" ]; then
                  targets_for_deb="$targets_for_deb $suite"
                fi
              done

              # No suite claimed it, so the build is release-independent.
              [ -n "$targets_for_deb" ] || targets_for_deb="$all_suites"

              for suite in $targets_for_deb; do
                echo "including $(basename "$deb") ($version) into $suite"
                $RP includedeb "$suite" "$deb"
              done
            done
          done < targets.jsonl

          # The keyring goes into every suite. Skip suites that already carry
          # this version, so a re-run or a reconciliation pass is not an error.
          for suite in $(jq -r -s 'map(.suites[]) | unique | .[]' projects/*.json); do
            if $RP list "$suite" alejandro-md-keyring | grep -q "${KEYRING_VERSION}"; then
              echo "keyring ${KEYRING_VERSION} already in $suite"
            else
              $RP includedeb "$suite" staging/bootstrap-deb/*.deb
            fi
          done

          $RP export
          find deb -maxdepth 3 -type d | sort

      - name: Build the rpm repository
        if: steps.targets.outputs.has_rpm == 'true'
        run: |
          set -euo pipefail
          mkdir -p rpm-repo/packages

          # Unlike the deb side there is no incremental database, so the rpm
          # tree is rebuilt from what the releases currently hold. The weekly
          # reconciliation run is what keeps every project present.
          rclone copy "r2:${R2_PUBLIC_BUCKET}/rpm/packages" rpm-repo/packages \
            --checksum || echo "no existing rpm packages"

          find incoming -path '*/rpm/*.rpm' -exec cp {} rpm-repo/packages/ \;
          cp staging/bootstrap-rpm/*.rpm rpm-repo/packages/

          # The old per-project workflows wrote a detached .asc beside each
          # rpm, which dnf ignores: gpgcheck reads the signature embedded in
          # the package header. rpm --addsign puts it there.
          echo "rpm $(rpm --version | awk '{print $NF}'), gpg $(gpg --version | head -1 | awk '{print $NF}')"
          gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print "secret key algo " $4 ", length " $3}'
          echo "signing with: $(rpm --eval '%__gpg_sign_cmd')"

          # Signed one at a time. A project that ships a damaged rpm is that
          # project's bug, and it must not stop every other project from
          # being published, so a package rpm refuses to sign is left out of
          # the repository and reported instead of aborting the run.
          rejected=()
          for f in rpm-repo/packages/*.rpm; do
            if rpm --addsign "$f" >rpm-sign.out 2>rpm-sign.err; then
              cat rpm-sign.out rpm-sign.err
              continue
            fi
            cat rpm-sign.out
            reason=$(grep -m1 . rpm-sign.err || echo "rpm --addsign failed")
            echo "::warning::$(basename "$f") was left out of the rpm repository: $reason"
            rejected+=("$(basename "$f"): $reason")
            rm -f "$f"
          done
          rm -f rpm-sign.err rpm-sign.out

          if [ "${#rejected[@]}" -gt 0 ]; then
            {
              echo "### rpm packages left out"
              echo
              echo "These were rejected by \`rpm --addsign\`, which refuses to sign a"
              echo "package whose header digests do not match its payload. Fix them in"
              echo "the project that builds them."
              echo
              for r in "${rejected[@]}"; do
                echo "- \`$r\`"
              done
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if ! compgen -G "rpm-repo/packages/*.rpm" >/dev/null; then
            echo "::error::Every rpm was rejected, so there is nothing to index."
            exit 1
          fi

          createrepo_c --update rpm-repo/
          # repo_gpgcheck verifies this, not the packages.
          rm -f rpm-repo/repodata/repomd.xml.asc
          gpg --batch --pinentry-mode loopback --detach-sign --armor \
            rpm-repo/repodata/repomd.xml

          ls -la rpm-repo/repodata

      - name: Verify rpm signatures the way dnf will
        if: steps.targets.outputs.has_rpm == 'true'
        run: |
          set -euo pipefail

          # Signing happens on Ubuntu, which now carries rpm 6, and rpm 6
          # keeps signatures in RPMSIGTAG_OPENPGP rather than the RSAHEADER
          # and DSAHEADER tags every older rpm reads. These packages target
          # el9, whose rpm is 4.16, so checking the signature with the rpm
          # that wrote it proves nothing. This runs the check a user's dnf
          # would run, with their rpm, against the key they would import.
          docker run --rm -v "$PWD:/w" -w /w quay.io/centos/centos:stream9 bash -c '
            set -e
            echo "verifying with $(rpm --version)"
            rpm --import gpg.key
            rpm --checksig rpm-repo/packages/*.rpm > checksig.txt 2>&1 || true
            cat checksig.txt
            if grep -v "signatures OK" checksig.txt | grep -q .; then
              echo "FAILED"
            else
              echo "ALL VERIFIED"
            fi
          ' | tee checksig.log
          sudo rm -f checksig.txt

          if ! grep -qx "ALL VERIFIED" checksig.log; then
            echo "::error::el9 cannot verify these signatures, so dnf would refuse the packages with gpgcheck=1."
            exit 1
          fi

      - name: Build the OpenWrt ipk feed
        if: steps.targets.outputs.has_ipk == 'true'
        run: |
          set -euo pipefail
          mkdir -p openwrt/ipk
          rclone copy "r2:${R2_PUBLIC_BUCKET}/openwrt/ipk" openwrt/ipk \
            --checksum --include "*.ipk" || true
          find incoming -path '*/ipk/*.ipk' -exec cp {} openwrt/ipk/ \;
          ./tools/mkopkg-index.sh openwrt/ipk
          ls -la openwrt/ipk

      - name: Build the OpenWrt apk feed
        if: steps.targets.outputs.has_apk == 'true'
        run: |
          set -euo pipefail
          mkdir -p openwrt/apk
          rclone copy "r2:${R2_PUBLIC_BUCKET}/openwrt/apk" openwrt/apk --checksum --include "*.apk" || true
          find incoming -path '*/apk/*.apk' -exec cp {} openwrt/apk/ ';'

          # apk indexing needs apk-tools, which Ubuntu does not package.
          # alpine:edge carries apk-tools 3, whose "mkndx" writes the v3
          # index OpenWrt 25.12 expects; "index" is the v2 fallback.
          #
          # Each package is indexed on its own first, so a file that is not
          # a real apk is named and skipped instead of taking the feed down.
          # unifi-gateway currently ships one: a single gzip member holding
          # only .PKGINFO and the install scripts, with no payload at all.
          docker run --rm -v "$PWD/openwrt/apk:/feed" -w /feed alpine:edge sh -c '
            set -e
            if apk mkndx --help >/dev/null 2>&1; then
              MK=mkndx; OUT=packages.adb; PROBE=/tmp/probe.adb
            else
              MK=index; OUT=APKINDEX.tar.gz; PROBE=/tmp/probe.tar.gz
            fi
            usable=""
            for f in *.apk; do
              [ -e "$f" ] || continue
              if apk $MK --output "$PROBE" "$f" >/dev/null 2>&1; then
                usable="$usable $f"
              else
                echo "REJECT $f"
              fi
              rm -f "$PROBE"
            done
            if [ -n "$usable" ]; then
              apk $MK --output "$OUT" $usable
              echo "INDEXED $MK"
            else
              echo "NOINDEX"
            fi
          ' | tee apk-index.log
          sudo chown -R "$(id -u):$(id -g)" openwrt/apk

          sed -n 's/^REJECT //p' apk-index.log > apk-rejected.txt || true
          while read -r bad; do
            [ -n "$bad" ] || continue
            echo "::warning::$bad is not a usable apk package and was left out of the OpenWrt apk feed."
            rm -f "openwrt/apk/$bad"
          done < apk-rejected.txt

          if grep -qx NOINDEX apk-index.log; then
            # Nothing valid to serve. Removing the directory keeps the upload
            # step from syncing an empty tree over a feed that may be live.
            echo "::warning::No usable apk package, so the apk feed was left untouched."
            rm -rf openwrt/apk
          fi

          if [ -s apk-rejected.txt ]; then
            {
              echo "### apk packages left out"
              echo
              echo "Not valid apk archives. Fix them in the project that builds them."
              echo
              sed 's/^/- /' apk-rejected.txt
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          ls -la openwrt/apk 2>/dev/null || true

      - name: Set up FreeBSD
        if: steps.targets.outputs.has_pkg == 'true'
        # v1.2.4 installed qemu-kvm by name, which on Ubuntu 26.04 is a
        # virtual package with several providers and so has no installation
        # candidate. The action never reached the point of booting a VM.
        uses: vmactions/freebsd-vm@v1.5.9
        with:
          usesh: true
          prepare: pkg install -y pkg

      - name: Build the FreeBSD pkg repository
        if: steps.targets.outputs.has_pkg == 'true'
        shell: freebsd {0}
        run: |
          set -e
          mkdir -p pkg-repo
          find incoming -path '*/pkg/*.pkg' -exec cp {} pkg-repo/ \;
          ls -l pkg-repo

          # One combined catalogue across every project, which is the whole
          # point of a central repository. The per-project indices attached to
          # the releases cannot be merged outside FreeBSD, so it is rebuilt
          # here from the packages themselves.
          pkg repo pkg-repo
          ls -l pkg-repo

      - name: Render site files
        run: |
          mkdir -p publish-site
          cp site/index.html site/setup.sh gpg.key publish-site/
          sed -i "s|@@BASE_URL@@|${PUBLIC_BASE_URL}|g" \
            publish-site/index.html publish-site/setup.sh

      - name: Upload to R2
        run: |
          set -euo pipefail

          if [ -d deb/pool ]; then
            # Order matters. New pool files must exist before the indices that
            # reference them, and pruning must happen only after the indices
            # have stopped referencing the old ones. Otherwise a client that
            # updates mid-publish gets a hash sum mismatch or a 404.
            rclone copy deb/pool  "r2:${R2_PUBLIC_BUCKET}/deb/pool"  --checksum --transfers 8 -v
            rclone sync deb/dists "r2:${R2_PUBLIC_BUCKET}/deb/dists" --checksum --transfers 8 -v
            rclone sync deb/pool  "r2:${R2_PUBLIC_BUCKET}/deb/pool"  --checksum --transfers 8 -v
          fi

          if [ -d rpm-repo ]; then
            rclone copy rpm-repo/packages "r2:${R2_PUBLIC_BUCKET}/rpm/packages" --checksum --transfers 8 -v
            rclone sync rpm-repo/repodata "r2:${R2_PUBLIC_BUCKET}/rpm/repodata" --checksum -v
            rclone sync rpm-repo/packages "r2:${R2_PUBLIC_BUCKET}/rpm/packages" --checksum --transfers 8 -v
          fi

          if [ -d pkg-repo ]; then
            rclone sync pkg-repo "r2:${R2_PUBLIC_BUCKET}/pkg" --checksum --transfers 8 -v
          fi

          if [ -d openwrt/ipk ]; then
            rclone sync openwrt/ipk "r2:${R2_PUBLIC_BUCKET}/openwrt/ipk" --checksum -v
          fi
          # Only with an index. Syncing a tree that has none would publish a
          # feed apk cannot read, or delete a working one.
          if [ -f openwrt/apk/packages.adb ] || [ -f openwrt/apk/APKINDEX.tar.gz ]; then
            rclone sync openwrt/apk "r2:${R2_PUBLIC_BUCKET}/openwrt/apk" --checksum -v
          fi

          rclone copy publish-site "r2:${R2_PUBLIC_BUCKET}" --checksum -v

      - name: Save reprepro state
        run: rclone sync ./db "r2:${R2_STATE_BUCKET}/reprepro-db" --checksum -v

      - name: Summary
        if: always()
        run: |
          {
            echo "### Published to ${PUBLIC_BASE_URL}"
            echo
            echo "Signed with \`${GPG_KEY_ID:-unknown}\`"
            echo
            if [ -f downloaded.txt ]; then
              echo "| project | tag |"
              echo "| --- | --- |"
              while read -r repo tag; do
                echo "| \`$repo\` | \`$tag\` |"
              done < downloaded.txt
            fi
            echo
            echo "| channel | built |"
            echo "| --- | --- |"
            echo "| deb | ${{ steps.targets.outputs.has_deb }} |"
            echo "| rpm | ${{ steps.targets.outputs.has_rpm }} |"
            echo "| pkg | ${{ steps.targets.outputs.has_pkg }} |"
            echo "| ipk | ${{ steps.targets.outputs.has_ipk }} |"
            echo "| apk | ${{ steps.targets.outputs.has_apk }} |"
          } >> "$GITHUB_STEP_SUMMARY"
